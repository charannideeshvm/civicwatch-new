<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Citizen Dashboard - CivicWatch+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">CivicWatch+</a>
        <div class="ms-auto">
            <span class="text-light me-3">Welcome, Citizen</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Complaints</h2>
        <a href="/complaint-form" class="btn btn-primary">Report New Complaint</a>
    </div>
    
    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Reported On</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${complaints}">
            <td th:text="${c.title}"></td>
            <td th:text="${c.category}"></td>
            <td>
                <span class="badge bg-secondary" th:text="${c.status}"></span>
            </td>
            <td>
                <span class="badge bg-danger" th:if="${c.priorityLevel == 'CRITICAL'}" th:text="${c.priorityLevel}"></span>
                <span class="badge bg-warning text-dark" th:if="${c.priorityLevel == 'HIGH'}" th:text="${c.priorityLevel}"></span>
                <span class="badge bg-primary" th:if="${c.priorityLevel == 'MEDIUM'}" th:text="${c.priorityLevel}"></span>
                <span class="badge bg-info text-dark" th:if="${c.priorityLevel == 'LOW'}" th:text="${c.priorityLevel}"></span>
            </td>
            <td th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy HH:mm')}"></td>
            <td>
                <a th:href="@{'/complaint-details/' + ${c.id}}" class="btn btn-sm btn-info">View</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
